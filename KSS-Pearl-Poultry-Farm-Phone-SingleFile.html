T.money = b => { if (!admin()) return '<p>Not available for your role.</p>'; const f = fin(b), E = db.exp.filter(e => e.b === b.id), Sl = sales(b);
  return `<div class="kpis">${kpi('Total cost', UGX(f.c), '', 'k1')}${kpi('Revenue', UGX(f.r), '', 'k2')}${kpi('Profit', UGX(f.profit), n1(f.margin) + '% margin', 'k3')}${kpi('Cost / bird', UGX(f.perBird))}${kpi('Cost / kg sold', f.kg ? UGX(f.perKg) : '-')}</div>
  <div class="card pad"><h4>Add expense (chick cost is set at batch creation)</h4>${ownForm('exp', fld('d', 'Date', 'date', today()) + fld('cat', 'Category', 'select', 'Feed', ['Feed', 'Vaccines & medicine', 'Litter', 'Heating fuel / power', 'Labour', 'Transport', 'Other']) + fld('amt', 'Amount (UGX)', 'number') + fld('note', 'Note'), 'Save expense')}</div>
  ${tbl(['Date', 'Category', 'UGX', 'Note', 'By', ''], E.map(e => [e.d, esc(e.cat), n0(e.amt), esc(e.note), esc(e.by || ''), rb('exp', e.id)]))}
  <div class="card pad"><h4>Record a sale</h4>${ownForm('sale', fld('d', 'Date', 'date', today()) + fld('kind', 'Sale type', 'select', 'live', ['live', 'head', 'dressed', 'egg', 'manure']) + fld('qty', 'Quantity (kg / birds / trays / sacks)', 'number') + fld('price', 'Price per unit (UGX)', 'number') + fld('heads', 'Birds sold (for live / dressed)', 'number') + fld('buyer', 'Buyer'), 'Save sale')}<p class="mut">live and dressed: quantity in kg. head: quantity = birds. egg: trays. manure: sacks.</p></div>

V.logq = () => { const act = db.b.filter(b => b.status !== 'closed'); if (!act.length) return `<h2>Daily log</h2><div class="card pad empty">${HEN_B}<p>Create a batch first.</p></div>`; const b = B(S.qb) && B(S.qb).status !== 'closed' ? B(S.qb) : act[0]; S.qb = b.id; S.bid = b.id;

const NUT = { b: [['Crude protein %', '21-23', '19-21', '18-19'], ['ME kcal/kg', '3,000', '3,100', '3,150'], ['Lysine (total) %', '1.30-1.40', '1.15-1.25', '1.00-1.10'], ['Methionine + cystine %', '0.95-1.00', '0.88-0.92', '0.80-0.85'], ['Calcium %', '0.90-1.00', '0.85-0.95', '0.78-0.90'], ['Available phosphorus %', '0.45', '0.42', '0.38'], ['Sodium %', '0.16-0.20', '0.16-0.19', '0.16-0.18'], ['Feed per bird per day', '18-60 g', '75-145 g', '150-180 g']],
  k: [['Crude protein %', '20-22', '16-18', '14-16', '16-17'], ['ME kcal/kg', '2,900', '2,800', '2,700', '2,700'], ['Lysine (total) %', '1.05+', '0.80+', '0.65+', '0.72+'], ['Methionine + cystine %', '0.80+', '0.65+', '0.58+', '0.65+'], ['Calcium %', '0.95-1.05', '0.85-1.00', '0.90-1.00', '3.5-4.0'], ['Available phosphorus %', '0.45', '0.40', '0.38', '0.40'], ['Feed per bird per day', '13-68 g', '70-100 g', '90-105 g', '110-125 g']] };
V.stock = () => { const ex = ING.map((x, i) => `<tr><td>${x[0]}</td><td>${x[1]}</td><td><input class="fm" data-i="${i}" type="number" step="any" value="0"></td><td><input class="fp" data-i="${i}" type="number" step="any" value="${db.prices[x[0]] || ''}" placeholder="UGX/kg"></td></tr>`).join('');
  return `<h2>Stock, feed & nutrition</h2>${tbl(['Item', 'In stock (kg)', 'Reorder at (kg)', 'Days left', ''], db.stock.map(s => [esc(s.name), n0(s.kg), n0(s.re), daysLeft(s) === null ? '-' : Math.floor(daysLeft(s)), rb('stock', s.id)]))}
  <div class="grid2">${admin() ? `<div class="card pad"><h4>Add stock item</h4>${form('stock', fld('name', 'Item (e.g. Broiler starter)') + fld('kg', 'Quantity (kg)', 'number') + fld('re', 'Reorder at (kg)', 'number', 50), 'Add')}</div>` : ''}<div class="card pad"><h4>Received feed (purchase)</h4>${form('buy', fld('id', 'Item', 'select', '', db.stock.length ? db.stock.map(s => s.name) : ['(add an item first)']) + fld('kg', 'Add kg (a 50 kg bag = 50)', 'number'), 'Add to stock')}</div></div>
  <details class="card pad" open><summary><b>Nutrient requirements in the feed</b></summary><h4>Broilers (per kg of feed)</h4>${tbl(['Nutrient', 'Starter Day 1-14', 'Grower Day 15-28', 'Finisher Day 29+'], NUT.b)}<h4>Kuroilers (working specification)</h4>${tbl(['Nutrient', 'Chick starter wk 1-4', 'Grower wk 5-12', 'Developer wk 13-18', 'Layer wk 19+'], NUT.k)}<p class="mut">Typical values from broiler breeder and poultry nutrition guides; confirm against your breeder's guide and feed label. Water: about twice the weight of feed eaten.</p></details>
  <div class="card pad"><h4>Feed formulation check: protein, energy, minerals, amino acids and cost</h4><div class="fgrid"><div><label>Target ration<select id="tg">${Object.keys(TGT).map(k => `<option>${k}</option>`).join('')}</select></label><p>${Object.keys(RECIPES).map(r => btn('recipe', 'Load: ' + r, r, 'ghost')).join(' ')} ${btn('recipe', 'Clear', '', 'ghost')}</p><div class="tw"><table><thead><tr><th>Ingredient</th><th>CP %</th><th>kg</th><th>UGX/kg</th></tr></thead><tbody>${ex}</tbody></table></div></div><div id="fres" class="fres"></div></div><p class="mut">Ingredient values are approximate. Have your final ration checked by a local animal-nutrition officer. Never feed mouldy ingredients (aflatoxin) or raw soya.</p></div>
  <div class="card pad"><h4>Mixing a protein concentrate with maize (Pearson square)</h4>${`<div class="fg"><label>Concentrate protein %<input class="pq" id="pq1" type="number" value="35"></label><label>Maize protein %<input class="pq" id="pq2" type="number" value="8.5"></label><label>Target protein %<input class="pq" id="pq3" type="number" value="21"></label></div><div id="pqr" class="al ok"></div>`}</div>`; };
function fcalc() { const r = document.getElementById('fres'); if (!r) return; let kg = 0, c = [0, 0, 0, 0, 0, 0], cost = 0;
  document.querySelectorAll('.fm').forEach(i => { const v = +i.value || 0, g = ING[+i.dataset.i], p = +document.querySelector(`.fp[data-i="${i.dataset.i}"]`).value || 0; kg += v; cost += v * p; for (let k = 0; k < 6; k++) c[k] += v * g[k + 1]; });
  const t = TGT[document.getElementById('tg').value], x = c.map(y => kg ? y / kg : 0), ok = (v, lo, hi = 1e9) => v >= lo - .001 && v <= hi + .001 ? '<i class="okc">OK</i>' : '<i class="warnc">CHECK</i>', m = (l, v, s, o) => `<div class="kpi"><small>${l}</small><b>${v}</b><em>${s} ${o || ''}</em></div>`;
  r.innerHTML = m('Batch size', n1(kg) + ' kg', 'aim for 100 kg') + m('Crude protein', n1(x[0]) + '%', `target ${t[0]}-${t[1]}%`, ok(x[0], t[0] - .3, t[1] + .5)) + m('Energy (ME)', n0(x[1]) + ' kcal/kg', `target ${n0(t[2])}+`, ok(x[1], t[2] - 100)) + m('Calcium', n2(x[2]) + '%', `target ${t[3]}-${t[4]}%`, ok(x[2], t[3] - .05, t[4] + .1)) + m('Available P', n2(x[3]) + '%', `target ${t[5]}+`, ok(x[3], t[5] - .02)) + m('Lysine', n2(x[4]) + '%', `target ${t[6]}+`, ok(x[4], t[6] - .03)) + m('Met + Cys', n2(x[5]) + '%', `target ${t[7]}+`, ok(x[5], t[7] - .03)) + m('Cost', kg && cost ? 'UGX ' + n0(cost / kg) + '/kg' : '-', cost ? 'UGX ' + n0(cost / kg * 50) + ' per 50 kg' : 'enter UGX/kg prices'); }
function pcalc() { const r = document.getElementById('pqr'); if (!r) return; const a = +$id('pq1').value, b = +$id('pq2').value, t = +$id('pq3').value; if (!(a > b) || t <= b || t >= a) { r.className = 'al warn'; r.textContent = 'Target must be between the maize and concentrate protein values.'; return; } const c = (t - b) / (a - b) * 100; r.className = 'al ok'; r.innerHTML = `Per 100 kg: <b>${n1(c)} kg concentrate</b> + <b>${n1(100 - c)} kg maize</b> = ${t}% protein. Check energy: add 2-3 kg vegetable oil for broiler feeds, and follow the concentrate label.`; }

function applyRecs(recs) { let n = 0; Object.keys(recs || {}).forEach(c => { if (!db[c]) db[c] = []; recs[c].forEach(r => { const i = db[c].findIndex(x => x.id === r.id), m = db[c][i];
    if (r.del) { if (m && (r.u || 0) >= (m.u || 0)) { db[c].splice(i, 1); n++; } return; } if (!m) { db[c].push(r); n++; } else if ((r.u || 0) > (m.u || 0)) { db[c][i] = r; n++; } }); });

  if (S.user) { const me = db.users.find(x => x.id === S.user.id); if (!me || !me.on) { S.user = null; localStorage.removeItem(SK); sessionStorage.removeItem(SK); } else S.user = me; } return n; }

    cols.forEach(k => { const a = db[k].filter(r => (r.u || 0) > (c.pu || 0)); if (a.length) push[k] = a; });
    const j = await post(c.url, { key: c.key, op: 'sync', since: c.since || 0, push, tomb: ow || tier === 'admin' ? db.tomb : [], meta: ow ? { farm: db.farm } : undefined });
    if (!j || !j.ok) throw new Error((j && j.error) || 'bad response');

    c.since = j.now; c.pu = t0; c.last = Date.now(); c.err = ''; lastErr = ''; if (ow || tier === 'admin') db.tomb = db.tomb.filter(x => x.u > t0); store(); updSync(); if (had && !S.user) { document.querySelectorAll('.modal').forEach(x => x.remove()); render(); toast('Your account was disabled or removed by the owner'); } else { if (n || updChanged) { softRender(); watch(); } checkUpdates(); } return true;

async function diagnose(url, err) {
